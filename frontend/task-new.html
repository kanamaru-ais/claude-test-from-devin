<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク作成 - タスク管理アプリ</title>
  <link rel="stylesheet" href="/css/task-form.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <span class="header-title">タスク管理アプリ</span>
      <nav class="header-nav">
        <a class="header-link" href="/projects">プロジェクト一覧</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <h1 class="page-title">タスク作成</h1>

    <div id="errorBanner" class="error-banner hidden"></div>

    <form id="taskForm" class="form-card" novalidate>
      <div class="form-group">
        <label for="taskTitle">タイトル <span class="required">*</span></label>
        <input
          type="text"
          id="taskTitle"
          class="form-input"
          maxlength="255"
          placeholder="タイトルを入力してください"
        >
        <p class="field-error hidden" id="titleError"></p>
      </div>

      <div class="form-group">
        <label for="taskDescription">説明</label>
        <textarea
          id="taskDescription"
          class="form-textarea"
          rows="5"
          placeholder="説明を入力してください"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="taskDueDate">期限</label>
        <input type="date" id="taskDueDate" class="form-input form-input--date">
        <p class="field-error hidden" id="dueDateError"></p>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="btnCancel">キャンセル</button>
        <button type="submit" class="btn btn-primary" id="btnSubmit">作成</button>
      </div>
    </form>
  </main>

  <script type="module" src="/js/task-new.js"></script>
</body>
</html>
